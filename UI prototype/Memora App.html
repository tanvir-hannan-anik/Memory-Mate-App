<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Memora — Use the app</title>
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #F2EFE7; }
  body { font-family: -apple-system, system-ui, sans-serif; }
  #root { width: 100%; min-height: 100vh; }

  @keyframes memora-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(30,110,114,0.45); }
    50%      { box-shadow: 0 0 0 14px rgba(30,110,114,0); }
  }
  @keyframes memora-ripple {
    0%   { transform: scale(0.85); opacity: 0.7; }
    100% { transform: scale(1.6);  opacity: 0; }
  }
  @keyframes memora-wave {
    0%, 100% { transform: scaleY(0.5); }
    50%      { transform: scaleY(1.4); }
  }
  @keyframes memora-dot {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30%           { transform: translateY(-4px); opacity: 1; }
  }
  button { font-family: inherit; }
  button:focus-visible { outline: 2px solid #1E6E72; outline-offset: 2px; }

  /* Hide all scrollbars but keep scroll behavior */
  *::-webkit-scrollbar { width: 0 !important; height: 0 !important; display: none !important; }
  * { scrollbar-width: none !important; -ms-overflow-style: none !important; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="tokens.jsx"></script>
<script type="text/babel" src="auth-screens.jsx"></script>
<script type="text/babel" src="patient-screens.jsx"></script>
<script type="text/babel" src="caregiver-screens.jsx"></script>
<script type="text/babel" src="transcript-screen.jsx"></script>
<script type="text/babel" src="profile-screens.jsx"></script>
<script type="text/babel" src="memora-runtime.jsx"></script>
</body>
</html>
